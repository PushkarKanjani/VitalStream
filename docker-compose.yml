# VitalStream — Docker Compose
# Stack: Zookeeper + Kafka 3.6 · Flink 1.18 · MongoDB 7 · Cassandra 4.1
# All data volumes are local (./data/*) so nothing is lost on container restart.

version: "3.8"

services:

  # ── ZOOKEEPER (Kafka dependency) ─────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: vs_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - ./data/zookeeper:/var/lib/zookeeper
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      retries: 5
    networks: [vs_net]

  # ── KAFKA 3.6 ────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: vs_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"   # external listener (host access)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      retries: 8
    networks: [vs_net]

  # ── KAFKA TOPIC INITIALIZER (one-shot) ───────────────────────────────────────
  kafka_init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: vs_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Creating Kafka topics...' &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic vitals.raw --partitions 6 --replication-factor 1 --config retention.ms=86400000 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic cases.events --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic alerts.raised --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic alerts.acknowledged --partitions 1 --replication-factor 1 &&
      echo 'Topics created:' &&
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    networks: [vs_net]

  # ── FLINK JOBMANAGER ─────────────────────────────────────────────────────────
  jobmanager:
    build: ./flink
    image: vitalstream-flink:1.18
    container_name: vs_flink_jm
    hostname: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"   # Flink Web UI
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        parallelism.default: 1
        taskmanager.numberOfTaskSlots: 4
        state.backend: filesystem
        state.checkpoints.dir: file:///opt/flink/data/checkpoints
        state.savepoints.dir: file:///opt/flink/data/savepoints
    volumes:
      - ./flink/jobs:/opt/flink/usrlib
      - ./data/flink:/opt/flink/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [vs_net]

  # ── FLINK TASKMANAGER ────────────────────────────────────────────────────────
  taskmanager:
    image: vitalstream-flink:1.18
    container_name: vs_flink_tm
    hostname: taskmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
    depends_on:
      - jobmanager
    volumes:
      - ./flink/jobs:/opt/flink/usrlib
    networks: [vs_net]

  # ── MONGODB 7.0 ──────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: vs_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: vitalstream
      MONGO_INITDB_ROOT_USERNAME: vsadmin
      MONGO_INITDB_ROOT_PASSWORD: vspass2024
    volumes:
      - ./data/mongodb:/data/db
      - ./scripts/init_mongodb.js:/docker-entrypoint-initdb.d/init_mongodb.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 8
    networks: [vs_net]

  # ── CASSANDRA 4.1 ────────────────────────────────────────────────────────────
  cassandra:
    image: cassandra:4.1
    container_name: vs_cassandra
    ports:
      - "9042:9042"   # CQL
      - "9160:9160"   # Thrift (legacy, for health checks)
    environment:
      CASSANDRA_CLUSTER_NAME: VitalStreamCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      HEAP_NEWSIZE: 256M
      MAX_HEAP_SIZE: 1G
    volumes:
      - ./data/cassandra:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 20s
      retries: 12
      start_period: 60s   # Cassandra is slow to start
    networks: [vs_net]

  # ── KAFKA UI (Kafdrop) — optional debug ──────────────────────────────────────
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: vs_kafdrop
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms32M -Xmx64M"
    networks: [vs_net]

volumes:
  vs_kafka_data:
  vs_zookeeper_data:
  vs_mongodb_data:
  vs_cassandra_data:
  vs_flink_data:

networks:
  vs_net:
    driver: bridge
